<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evashalom Report Generator</title>
<script src="https://unpkg.com/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{--blue:#185FA5;--blue-light:#E6F1FB;--blue-dark:#0C447C;--teal:#0F6E56;--teal-light:#E1F5EE;--red:#A32D2D;--red-light:#FCEBEB;--green:#3B6D11;--green-light:#EAF3DE;--text:#2C2C2A;--text-muted:#888780;--border:#D3D1C7;--bg-sec:#F1EFE8;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',sans-serif;background:#f5f4f0;color:var(--text);min-height:100vh;}
.header{background:#0C447C;color:white;padding:1rem 2rem;display:flex;align-items:center;gap:1rem;}
.header-logo{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:white;flex-shrink:0;}
.header h1{font-size:18px;font-weight:600;}
.header p{font-size:13px;opacity:.75;margin-top:2px;}
.container{max-width:880px;margin:2rem auto;padding:0 1.5rem;}
.card{background:white;border-radius:12px;border:1px solid var(--border);padding:1.5rem;margin-bottom:1.5rem;}
.card-title{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1rem;}
.search-row{display:flex;gap:12px;align-items:flex-end;}
.field{display:flex;flex-direction:column;gap:6px;flex:1;}
.field label{font-size:13px;font-weight:500;color:var(--text-muted);}
.field input{height:42px;border:1px solid var(--border);border-radius:8px;padding:0 12px;font-size:15px;color:var(--text);background:white;outline:none;transition:border-color .15s;}
.field input:focus{border-color:var(--blue);}
.field input::placeholder{color:var(--text-muted);font-size:14px;}
.btn{height:42px;padding:0 20px;border-radius:8px;border:none;font-size:14px;font-weight:600;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;}
.btn-primary{background:var(--blue);color:white;}.btn-primary:hover{background:#0C447C;}.btn-primary:disabled{background:var(--border);cursor:not-allowed;}
.btn-success{background:var(--teal);color:white;}.btn-success:hover{background:#085041;}.btn-success:disabled{background:var(--border);cursor:not-allowed;}
.status-bar{padding:12px 16px;border-radius:8px;font-size:14px;display:flex;align-items:center;gap:10px;margin-bottom:1rem;}
.status-loading{background:var(--blue-light);color:#0C447C;}.status-error{background:var(--red-light);color:var(--red);}.status-success{background:var(--green-light);color:var(--green);}
.patient-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:1.5rem;}
.pf{display:flex;flex-direction:column;gap:4px;}
.pf .lbl{font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;}
.pf .val{font-size:15px;font-weight:500;color:var(--text);}.pf .val.empty{color:var(--border);font-style:italic;font-weight:400;}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:1.5rem;}
.badge{padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;background:var(--blue-light);color:#0C447C;}
.sections-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:1.5rem;}
.sc{border:1px solid var(--border);border-radius:8px;padding:12px 14px;}
.sc.has{border-color:var(--teal);background:var(--teal-light);}.sc.no{opacity:.5;}
.sc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sc-name{font-size:13px;font-weight:600;}.sc.has .sc-name{color:var(--teal);}
.dot{width:8px;height:8px;border-radius:50%;}.dot-g{background:var(--teal);}.dot-x{background:var(--border);}
.sc-params{font-size:12px;color:var(--text-muted);line-height:1.5;}
.rtable{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:1.5rem;}
.rtable th{text-align:left;padding:8px 10px;background:var(--bg-sec);font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);}
.rtable td{padding:8px 10px;border-bottom:1px solid #f0efe9;}.rtable tr:last-child td{border-bottom:none;}
.rtable .pn{font-weight:500;}.rtable .rv{font-weight:600;color:#0C447C;}.rtable .rv.abn{color:var(--red);}.rtable .rr{color:var(--text-muted);font-size:12px;}
.subhdr td{background:#E8F0FA;font-weight:700;color:#1B3A6B;font-size:12px;text-transform:uppercase;letter-spacing:.05em;}
.divider{border:none;border-top:1px solid var(--border);margin:1.5rem 0;}
.gen-row{display:flex;align-items:center;justify-content:space-between;gap:1rem;}
.gen-note{font-size:13px;color:var(--text-muted);}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin .6s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none!important;}
.view-toggle{display:flex;gap:0;background:rgba(255,255,255,0.12);border-radius:10px;padding:4px;margin-left:auto;}
.view-toggle button{background:none;border:none;color:rgba(255,255,255,0.7);padding:8px 18px;border-radius:7px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.view-toggle button.active{background:white;color:#0C447C;}
.entry-section{margin-bottom:1.5rem;}
.entry-section-title{font-size:13px;font-weight:700;color:#0C447C;margin-bottom:.75rem;padding-bottom:6px;border-bottom:2px solid #E6F1FB;}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.entry-field{display:flex;flex-direction:column;gap:5px;}
.entry-field label{font-size:13px;font-weight:600;color:var(--text);}
.entry-field .ref-hint{font-size:11px;color:var(--text-muted);font-weight:400;}
.entry-field input{height:40px;border:1px solid var(--border);border-radius:7px;padding:0 10px;font-size:14px;outline:none;transition:border-color .15s;}
.entry-field input:focus{border-color:var(--blue);}
.entry-field input.flagged{border-color:var(--red);background:var(--red-light);}
.analyst-row{display:flex;gap:12px;align-items:flex-end;margin-top:1rem;padding-top:1rem;border-top:1px solid var(--border);}
.no-tests-msg{padding:1rem;background:var(--bg-sec);border-radius:8px;color:var(--text-muted);font-size:14px;text-align:center;}
@media(max-width:600px){.search-row,.sections-grid,.gen-row{flex-direction:column;}.sections-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div class="header">
  <div class="header-logo">ES</div>
  <div><h1>Evashalom Medical Diagnostic Services</h1><p>Laboratory Information System</p></div>
  <div class="view-toggle">
    <button id="tabReport" class="active" onclick="switchView('report')">Generate Report</button>
    <button id="tabEntry" onclick="switchView('entry')">Enter Results</button>
  </div>
</div>
<div class="container">
  <!-- ============ REPORT VIEW ============ -->
  <div id="reportView">
    <div class="card">
      <div class="card-title">Search Patient by Lab Number</div>
      <div class="search-row">
        <div class="field">
          <label>Lab Number (same as Google Sheet row number)</label>
          <input type="number" id="labInput" placeholder="e.g. 2, 3, 446, 2990" min="2"/>
        </div>
        <button class="btn btn-primary" onclick="searchPatient()" id="searchBtn">Search</button>
      </div>
    </div>
    <div id="statusBar" class="hidden"></div>
    <div id="patientCard" class="card hidden">
      <div class="card-title">Patient Information</div>
      <div class="patient-grid" id="patientGrid"></div>
      <div class="card-title" style="margin-top:.5rem;">Tests Requested</div>
      <div class="badges" id="testsBadges"></div>
      <hr class="divider">
      <div class="card-title">Sections with Data</div>
      <div class="sections-grid" id="sectionsGrid"></div>
      <div id="resultsPreview"></div>
      <hr class="divider">
      <div class="gen-row">
        <div class="gen-note" id="genNote"></div>
        <button class="btn btn-success" onclick="generateReport()" id="genBtn">Download Report (.docx)</button>
      </div>
    </div>
  </div>

  <!-- ============ ENTRY VIEW ============ -->
  <div id="entryView" class="hidden">
    <div class="card">
      <div class="card-title">Enter Results by Lab Number</div>
      <div class="search-row">
        <div class="field">
          <label>Lab Number (same as Google Sheet row number)</label>
          <input type="number" id="entryLabInput" placeholder="e.g. 2, 3, 446, 2990" min="2"/>
        </div>
        <button class="btn btn-primary" onclick="loadEntryPatient()" id="entrySearchBtn">Load Patient</button>
      </div>
    </div>
    <div id="entryStatusBar" class="hidden"></div>
    <div id="entryCard" class="card hidden">
      <div class="card-title">Patient Information</div>
      <div class="patient-grid" id="entryPatientGrid"></div>
      <div class="card-title" style="margin-top:.5rem;">Tests Requested</div>
      <div class="badges" id="entryTestsBadges"></div>
      <hr class="divider">
      <div id="entryFields"></div>
      <div class="analyst-row">
        <div class="field" style="max-width:320px;">
          <label>Analyst Name</label>
          <input type="text" id="analystName" placeholder="Who is entering these results?"/>
        </div>
        <button class="btn btn-success" onclick="saveResults()" id="saveBtn">Save Results</button>
      </div>
    </div>
  </div>
</div>

function cleanValue(val) {
  if (!val) return val;
  const m = val.match(/^([<>]?\s*[\d.]+)/);
  return m ? m[1].trim() : val;
}
function formatNumber(val) {
  const clean = cleanValue(val);
  const num = parseFloat(clean);
  if (isNaN(num)) return val;
  if (Number.isInteger(num) && num >= 1000) return num.toLocaleString('en-GB');
  return clean !== val ? clean : val;
}
function checkAbnormal(key, value, refMap) {
  const ref = refMap[key];
  const num = parseFloat(cleanValue(value));
  if (!ref || isNaN(num)) return null;
  if (num < ref[0]) return 'low';
  if (num > ref[1]) return 'high';
  return null;
}

// Minimal CSV parser that handles quoted fields with commas/newlines
function parseCSV(text) {
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"') {
        if (text[i+1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else field += ch;
    } else {
      if (ch === '"') inQuotes = true;
      else if (ch === ',') { row.push(field); field = ''; }
      else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
      else if (ch === '\r') { /* skip */ }
      else field += ch;
    }
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

// Fetch a tab as CSV — preserves EVERY row (including empty ones),
// so sheet row N is always rows[N-1]. Scales to 20,000+ rows.
async function fetchTabCsv(sheetId, gid) {
  const url = 'https://docs.google.com/spreadsheets/d/' + sheetId + '/export?format=csv&gid=' + gid;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Sheet fetch failed (gid ' + gid + ')');
  const text = await res.text();
  const all = parseCSV(text);
  const cols = (all[0] || []).map(c => (c || '').trim());
  const rows = all.slice(1).map(r => r.map(v => (v || '').trim()));
  return { cols, rows };
}
function extractResults(cols, row, colMap) {
  const results = [];
  cols.forEach((col, i) => {
    const val = (row[i] || '').trim();
    if (val && colMap[col]) results.push({ key: col, label: colMap[col], value: val });
  });
  return results;
}
function formatDate(raw) {
  if (!raw) return '\u2014';
  const m = raw.match(/Date\((\d+),(\d+),(\d+)\)/);
  if (m) { const d = new Date(parseInt(m[1]), parseInt(m[2]), parseInt(m[3])); return d.toLocaleDateString('en-GB'); }
  return raw;
}

async function searchPatient() {
  const labNum = parseInt(document.getElementById('labInput').value);
  if (!labNum || labNum < 2) { showStatus('Please enter a valid lab number (minimum 2).', 'error'); return; }
  const btn = document.getElementById('searchBtn');
  btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Searching...';
  document.getElementById('patientCard').classList.add('hidden');
  showStatus('Loading patient record...', 'loading');
  try {
    const patientData = await fetchTabCsv(PATIENT_ID, PATIENT_GID);
    const rowIndex = labNum - 2;
    const pRow = patientData.rows[rowIndex] || [];
    if (!pRow || !pRow[1]) { showStatus('No patient found at lab number ' + labNum + '.', 'error'); btn.disabled = false; btn.innerHTML = 'Search'; return; }
    let patientDate = '';
    for (let i = rowIndex; i >= 0; i--) { if (patientData.rows[i] && patientData.rows[i][0]) { patientDate = patientData.rows[i][0]; break; } }
    const rawAge = pRow[3] ? pRow[3].trim() : '';
    const age = rawAge ? (/^\d+$/.test(rawAge) ? rawAge + ' YEARS' : rawAge) : '';
    currentPatient = {
      labNo: 'ES' + labNum + '/26', name: pRow[1] || '', gender: pRow[2] || '',
      age: age, phone: pRow[4] || '', investigations: pRow[5] || '',
      referredBy: pRow[6] || '', amount: pRow[8] || '',
      paymentStatus: pRow[11] || '', date: formatDate(patientDate), rowIndex: rowIndex
    };
    showStatus('Loading laboratory results...', 'loading');
    const results = await Promise.all([
      fetchTabCsv(RESULT_ID, GIDS.CHEMISTRY).catch(() => ({ cols: [], rows: [] })),
      fetchTabCsv(RESULT_ID, GIDS.HAEMATOLOGY).catch(() => ({ cols: [], rows: [] })),
      fetchTabCsv(RESULT_ID, GIDS.HORMONES).catch(() => ({ cols: [], rows: [] })),
      fetchTabCsv(RESULT_ID, GIDS.MICROBIOLOGY).catch(() => ({ cols: [], rows: [] }))
    ]);
    currentResults = {
      chemistry:    extractResults(results[0].cols, results[0].rows[rowIndex] || [], CHEM_MAP),
      haematology:  extractResults(results[1].cols, results[1].rows[rowIndex] || [], HAEM_MAP),
      hormones:     extractResults(results[2].cols, results[2].rows[rowIndex] || [], HORM_MAP),
      microbiology: extractResults(results[3].cols, results[3].rows[rowIndex] || [], MICRO_MAP)
    };
    renderPatientCard(); hideStatus();
  } catch(err) { console.error(err); showStatus('Error: ' + err.message, 'error'); }
  btn.disabled = false; btn.innerHTML = 'Search';
}

function makeTable(title, results, refNumMap, refStrMap, unitMap) {
  let rows = '';
  let cardiacDone = false;
  results.forEach(function(res) {
    if (CARDIAC_KEYS.has(res.key) && !cardiacDone) {
      cardiacDone = true;
      rows += '<tr class="subhdr"><td colspan="4">Cardiac Enzyme</td></tr>';
    }
    const abn = checkAbnormal(res.key, res.value, refNumMap);
    const flag = abn === 'high' ? ' ↑' : abn === 'low' ? ' ↓' : '';
    rows += '<tr><td class="pn">' + res.label + '</td><td class="rv' + (abn?' abn':'') + '">' + formatNumber(res.value) + flag + '</td><td class="rr">' + (unitMap[res.key]||'—') + '</td><td class="rr">' + (refStrMap[res.key]||'—') + '</td></tr>';
  });
  return '<div class="card-title" style="margin-bottom:.75rem;">' + title + '</div><table class="rtable"><thead><tr><th>Test Name</th><th>Result</th><th>Unit</th><th>Reference Range</th></tr></thead><tbody>' + rows + '</tbody></table>';
}

        const rowFill = ri%2===0 ? 'FFFFFF' : GRAY_ROW;
        rows.push(new TableRow({children:[
          mkCell(par(run(res.label,{sz:19})),{w:colW[0],borders:allB(4,'E8E8E8'),fill:rowFill,pad:pd(70,70,120,120)}),
          mkCell(par(run(formatNumber(res.value)+flag,{bold:true,sz:19,color:rColor}),{align:AlignmentType.CENTER}),{w:colW[1],borders:allB(4,'E8E8E8'),fill:rowFill,pad:pd(70,70,80,80)}),
          mkCell(par(run(unitMap[res.key]||'',{sz:17,color:'777777'}),{align:AlignmentType.CENTER}),{w:colW[2],borders:allB(4,'E8E8E8'),fill:rowFill,pad:pd(70,70,80,80)}),
          mkCell(par(run(refStrMap[res.key]||'—',{sz:17,color:'555555'}),{align:AlignmentType.CENTER}),{w:colW[3],borders:allB(4,'E8E8E8'),fill:rowFill,pad:pd(70,70,80,80)})
        ]}));
        ri++;
      });
      return [new Table({width:{size:W,type:WidthType.DXA},columnWidths:colW,rows:rows}), par('',{after:200})];
    }

    const logoRow = new TableRow({children:[
      mkCell(par(new ImageRun({data:logoData,transformation:{width:72,height:72},type:'jpg'}),{align:AlignmentType.CENTER}),{w:1200,borders:noBorders,pad:pd(0,0,0,80)}),
      mkCell([
        par(run('EVASHALOM MEDICAL DIAGNOSTIC SERVICES',{bold:true,sz:26,color:NAVY}),{after:40}),
        par(run('No. 6 Engr. Fred Ejiofor Crescent, Behind Mr. Biggs, Asaba, Delta State',{sz:16,color:'444444'}),{after:20}),
        par(run('No. 1 Governor Street, Beside Wetland Microfinance Bank, Asaba, Delta State',{sz:16,color:'444444'}),{after:20}),
        par(run('Tel: 07060904931  |  08037068465     Email: shalomnwagodfmc@gmail.com',{sz:16,color:'444444'}))
      ],{w:9240,borders:noBorders,pad:pd(0,0,80,0)})
    ]});

    const titleRow = new TableRow({children:[
      mkCell(par(run('LABORATORY RESULT REPORT',{bold:true,sz:22,color:'FFFFFF'}),{align:AlignmentType.CENTER}),{w:W,borders:allB(6,MID_BLUE),fill:MID_BLUE,pad:pd(120,120,160,160)})
    ]});

    const sigRow = new TableRow({children:[
      mkCell([
        par(run('_________________________________',{sz:20,color:'999999'}),{after:40}),
        par(run('Authorized Signatory',{bold:true,sz:19,color:NAVY}),{after:20}),
        par(run('Evashalom Medical Diagnostic Services',{sz:17,color:'555555'}))
      ],{w:5220,borders:noBorders,pad:pd(80,80,0,0)}),
      mkCell([
        par(run('Date: '+new Date().toLocaleDateString('en-GB'),{sz:19,color:'333333'}),{after:40,align:AlignmentType.RIGHT}),
        par(run('Report Status: FINAL',{bold:true,sz:19,color:NAVY}),{after:0,align:AlignmentType.RIGHT})
      ],{w:5220,borders:noBorders,pad:pd(80,80,0,0)})
    ]});

    const doc = new Document({sections:[{
      properties:{page:{
        size:{width:11906,height:16838},
        margin:{top:640,right:800,bottom:800,left:800},
        borders:{top:solid(12,NAVY),bottom:solid(12,NAVY),left:solid(12,NAVY),right:solid(12,NAVY)}
      }},
      children:[
        new Table({width:{size:W,type:WidthType.DXA},columnWidths:[1200,9240],rows:[logoRow]}),
        new Paragraph({border:{bottom:{style:BorderStyle.SINGLE,size:16,color:NAVY,space:1}},children:[run('')],spacing:{before:80,after:160}}),
        new Table({width:{size:W,type:WidthType.DXA},rows:[titleRow]}),
        par('',{after:120}),
        new Table({width:{size:W,type:WidthType.DXA},columnWidths:[1700,3420,1700,3620],rows:infoRows}),
        par('',{after:200}),
        ...buildTable('CHEMISTRY SECTION',    r.chemistry,    CHEM_REF_NUM, CHEM_REF_STR, CHEM_UNIT),
        ...buildTable('HAEMATOLOGY SECTION',  r.haematology,  HAEM_REF_NUM, HAEM_REF_STR, HAEM_UNIT),
        ...buildTable('HORMONES & SEROLOGY',  r.hormones,     HORM_REF_NUM, HORM_REF_STR, HORM_UNIT),
        ...buildTable('MICROBIOLOGY SECTION', r.microbiology, {},           MICRO_REF_STR, {}),
        new Paragraph({border:{top:{style:BorderStyle.SINGLE,size:8,color:NAVY,space:1}},children:[run('')],spacing:{before:200,after:120}}),
        par([run('NOTE: ',{bold:true,sz:17,color:'555555'}),run('Results should be interpreted in the context of clinical findings. Abnormal values are flagged with ↑ (high) or ↓ (low).',{sz:17,color:'666666',italic:true})],{after:200}),
        new Table({width:{size:W,type:WidthType.DXA},columnWidths:[5220,5220],rows:[sigRow]})
      ]
    }]});

    const blob = await Packer.toBlob(doc);
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = p.labNo.replace('/','_') + '-' + p.name.replace(/\s+/g,'_') + '.docx';
    a.click();
    URL.revokeObjectURL(url);
    showStatus('Report downloaded: ' + p.labNo + ' — ' + p.name, 'success');
  } catch(err) { console.error(err); showStatus('Failed to generate: ' + err.message, 'error'); }
  btn.disabled = false; btn.innerHTML = 'Download Report (.docx)';
}

// ========================= ENTRY VIEW =========================

// Which section each map belongs to, for building entry fields
const SECTION_DEFS = [
  {name:'Chemistry',    gid:GIDS.CHEMISTRY,    map:CHEM_MAP, unit:CHEM_UNIT, refStr:CHEM_REF_STR, refNum:CHEM_REF_NUM},
  {name:'Haematology',  gid:GIDS.HAEMATOLOGY,  map:HAEM_MAP, unit:HAEM_UNIT, refStr:HAEM_REF_STR, refNum:HAEM_REF_NUM},
  {name:'Hormones & Serology', gid:GIDS.HORMONES, map:HORM_MAP, unit:HORM_UNIT, refStr:HORM_REF_STR, refNum:HORM_REF_NUM},
  {name:'Microbiology', gid:GIDS.MICROBIOLOGY, map:MICRO_MAP, unit:{}, refStr:MICRO_REF_STR, refNum:{}}
];

let entryPatient = null;
let entrySheetData = null; // {sectionName: {cols, rows}}

function switchView(view) {
  const isReport = view === 'report';
  document.getElementById('reportView').classList.toggle('hidden', !isReport);
  document.getElementById('entryView').classList.toggle('hidden', isReport);
  document.getElementById('tabReport').classList.toggle('active', isReport);
  document.getElementById('tabEntry').classList.toggle('active', !isReport);
}

function showEntryStatus(msg, type) {
  const bar = document.getElementById('entryStatusBar');
  bar.className = 'status-bar status-' + type;
  bar.innerHTML = msg;
  bar.classList.remove('hidden');
}
function hideEntryStatus() { document.getElementById('entryStatusBar').classList.add('hidden'); }

async function loadEntryPatient() {
  const labNum = parseInt(document.getElementById('entryLabInput').value);
  if (!labNum || labNum < 2) { showEntryStatus('Please enter a valid lab number (minimum 2).', 'error'); return; }
  const btn = document.getElementById('entrySearchBtn');
  btn.disabled = true; btn.innerHTML = '<div class="spinner"></div> Loading...';
  document.getElementById('entryCard').classList.add('hidden');
  showEntryStatus('Loading patient...', 'loading');
  try {
    const patientData = await fetchTabCsv(PATIENT_ID, PATIENT_GID);
    const rowIndex = labNum - 2;
    const pRow = patientData.rows[rowIndex] || [];
    if (!pRow || !pRow[1]) { showEntryStatus('No patient found at lab number ' + labNum + '.', 'error'); btn.disabled = false; btn.innerHTML = 'Load Patient'; return; }
    let patientDate = '';
    for (let i = rowIndex; i >= 0; i--) { if (patientData.rows[i] && patientData.rows[i][0]) { patientDate = patientData.rows[i][0]; break; } }
    const rawAge = pRow[3] ? pRow[3].trim() : '';
    const age = rawAge ? (/^\d+$/.test(rawAge) ? rawAge + ' YEARS' : rawAge) : '';
    entryPatient = {
      labNo: 'ES' + labNum + '/26', name: pRow[1] || '', gender: pRow[2] || '',
      age: age, investigations: pRow[5] || '', referredBy: pRow[6] || '',
      date: formatDate(patientDate), rowIndex: rowIndex, labNum: labNum
    };
    // Fetch existing results so we can pre-fill any already-entered values
    showEntryStatus('Loading existing results...', 'loading');
    const fetched = await Promise.all(SECTION_DEFS.map(s => fetchTabCsv(RESULT_ID, s.gid).catch(() => ({cols:[],rows:[]}))));
    entrySheetData = {};
    SECTION_DEFS.forEach((s, i) => { entrySheetData[s.name] = fetched[i]; });
    renderEntryForm();
    hideEntryStatus();
  } catch(err) { console.error(err); showEntryStatus('Error: ' + err.message, 'error'); }
  btn.disabled = false; btn.innerHTML = 'Load Patient';
}

function renderEntryForm() {
  const p = entryPatient;
  // Patient info
  const fields = [
    {lbl:'Lab No.',val:p.labNo},{lbl:'Patient Name',val:p.name},
    {lbl:'Gender',val:p.gender},{lbl:'Age',val:p.age},
    {lbl:'Referred By',val:p.referredBy||'—'},{lbl:'Request Date',val:p.date||'—'}
  ];
  document.getElementById('entryPatientGrid').innerHTML = fields.map(f =>
    '<div class="pf"><span class="lbl">' + f.lbl + '</span><span class="val' + (f.val==='—'?' empty':'') + '">' + f.val + '</span></div>'
  ).join('');
  document.getElementById('entryTestsBadges').innerHTML = p.investigations.split(/[,\n]/).map(t => t.replace(/"/g,'').trim()).filter(Boolean).map(t => '<span class="badge">' + t + '</span>').join('');

  // Build input fields for EVERY parameter in each section.
  // Pre-fill with any existing value already in the sheet for this row.
  let html = '';
  SECTION_DEFS.forEach(section => {
    const sheet = entrySheetData[section.name];
    const existingRow = (sheet.rows[p.rowIndex]) || [];
    const paramKeys = Object.keys(section.map);
    let fieldsHtml = '';
    paramKeys.forEach(key => {
      const colIndex = sheet.cols.indexOf(key);
      const existingVal = (colIndex >= 0 && existingRow[colIndex]) ? existingRow[colIndex] : '';
      const label = section.map[key];
      const unit = section.unit[key] || '';
      const ref = section.refStr[key] || '';
      const hint = [unit, ref ? 'Ref: ' + ref : ''].filter(Boolean).join('  \u2022  ');
      const safeId = 'entry__' + section.name.replace(/[^a-zA-Z]/g,'') + '__' + key.replace(/[^a-zA-Z0-9]/g,'_');
      fieldsHtml += '<div class="entry-field">'
        + '<label>' + label + (unit ? ' <span class="ref-hint">(' + unit + ')</span>' : '') + '</label>'
        + '<input type="text" id="' + safeId + '" data-section="' + section.name + '" data-key="' + key + '" value="' + existingVal.replace(/"/g,'&quot;') + '" '
        + 'oninput="validateEntryField(this)" placeholder="—"/>'
        + (ref ? '<span class="ref-hint">Ref: ' + ref + '</span>' : '')
        + '</div>';
    });
    html += '<div class="entry-section"><div class="entry-section-title">' + section.name + '</div><div class="entry-grid">' + fieldsHtml + '</div></div>';
  });
  document.getElementById('entryFields').innerHTML = html;
  document.getElementById('entryCard').classList.remove('hidden');
}

function validateEntryField(input) {
  const section = input.getAttribute('data-section');
  const key = input.getAttribute('data-key');
  const def = SECTION_DEFS.find(s => s.name === section);
  if (!def) return;
  const abn = checkAbnormal(key, input.value, def.refNum);
  input.classList.toggle('flagged', !!abn);
}

function saveResults() {
  const analyst = document.getElementById('analystName').value.trim();
  if (!analyst) { showEntryStatus('Please enter the analyst name before saving.', 'error'); return; }
  // Gather all non-empty entered values
  const inputs = document.querySelectorAll('#entryFields input');
  const toSave = [];
  inputs.forEach(inp => {
    const val = inp.value.trim();
    if (val) toSave.push({ section: inp.getAttribute('data-section'), key: inp.getAttribute('data-key'), value: val });
  });
  if (toSave.length === 0) { showEntryStatus('No results entered to save.', 'error'); return; }
  // Phase 2 will wire this to a secure Apps Script write endpoint.
  console.log('READY TO SAVE:', { labNum: entryPatient.labNum, analyst: analyst, results: toSave });
  showEntryStatus('Saving is coming in the next phase. ' + toSave.length + ' value(s) captured for ' + entryPatient.name + ' (analyst: ' + analyst + '). Check the browser console to see the captured data.', 'success');
}

document.getElementById('entryLabInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') loadEntryPatient(); });

document.getElementById('labInput').addEventListener('keydown', function(e) { if (e.key === 'Enter') searchPatient(); });
</script>
